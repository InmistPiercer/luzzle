name: Build Electron Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: electron:mac:all
            label: macos
          - os: windows-latest
            script: electron:win
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: npm --prefix app run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: luzzle-${{ matrix.label }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luzzle-macos
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: luzzle-windows
          path: release/windows
      - name: Check platform installers
        run: |
          shopt -s nullglob
          arm64=(release/macos/*-arm64.dmg)
          intel=(release/macos/*.dmg)
          windows=(release/windows/*.exe)
          test "${#arm64[@]}" -eq 1
          test "${#intel[@]}" -eq 2
          test "${#windows[@]}" -eq 2
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/macos/*.dmg
            release/macos/*.zip
            release/windows/*.exe

name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: npm --prefix app test
      - run: npm --prefix app run lint
      - run: npm --prefix app run build
      - run: npm --prefix app run build:test
      - name: Assemble GitHub Pages bundle (/ + /demo/)
        run: |
          rm -rf app/dist-pages
          cp -a app/dist app/dist-pages
          cp -a app/dist-test app/dist-pages/demo
          test -f app/dist-pages/index.html
          test -f app/dist-pages/demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
